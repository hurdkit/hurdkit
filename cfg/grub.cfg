menuentry 'Debian GNU/Hurd (recovery mode)' --class debian --class gnu --class os $menuentry_id_option 'gnuhurd-/boot/gnumach-1.8-hurdkit.gz-recovery-41bea907-da2e-4747-b848-8a2af4ce43bf' {
		insmod part_msdos
		insmod ext2
		search --no-floppy --fs-uuid --set=root 41bea907-da2e-4747-b848-8a2af4ce43bf
		echo		'Loading GNU Mach ...'
		multiboot	/boot/gnumach-1.8-amd64-up.gz root=part:2:device:wd0 -s console=com0
		insmod part_msdos
		insmod ext2
		search --no-floppy --fs-uuid --set=root 41bea907-da2e-4747-b848-8a2af4ce43bf
		echo		'Loading the Hurd ...'
		module          /hurd/pci-arbiter.static pci-arbiter \
				--host-priv-port='${host-port}' --device-master-port='${device-port}' \
				--next-task='${acpi-task}' \
				'$(pci-task=task-create)' '$(task-resume)'
		module          /hurd/acpi.static acpi \
				 \
				--next-task='${disk-task}' \
				'$(acpi-task=task-create)' 
		module          /hurd/rumpdisk.static rumpdisk \
				 \
				--next-task='${fs-task}' \
				'$(disk-task=task-create)' 
		module		/hurd/ext2fs.static ext2fs  \
				--multiboot-command-line='${kernel-command-line}' \
				 \
				--exec-server-task='${exec-task}' -T typed '${root}' \
				'$(fs-task=task-create)' 
		module		/lib/ld-x86-64.so.1 exec /hurd/exec '$(exec-task=task-create)'
}

if [ "$grub_platform" = "efi" ]; then
  insmod bli
  fwsetup --is-supported
  if [ "$?" = 0 ]; then
	menuentry 'UEFI Firmware Settings' $menuentry_id_option 'uefi-firmware' {
		fwsetup
	}
  fi
fi

if [ -f  ${config_directory}/custom.cfg ]; then
  source ${config_directory}/custom.cfg
elif [ -z "${config_directory}" -a -f  $prefix/custom.cfg ]; then
  source $prefix/custom.cfg
fi
