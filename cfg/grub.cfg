if [ -s $prefix/grubenv ]; then
  set have_grubenv=true
  load_env
fi
if [ "${next_entry}" ] ; then
   set default="${next_entry}"
   set next_entry=
   save_env next_entry
   set boot_once=true
else
   set default="0"
fi

if [ x"${feature_menuentry_id}" = xy ]; then
  menuentry_id_option="--id"
else
  menuentry_id_option=""
fi

export menuentry_id_option

if [ "${prev_saved_entry}" ]; then
  set saved_entry="${prev_saved_entry}"
  save_env saved_entry
  set prev_saved_entry=
  save_env prev_saved_entry
  set boot_once=true
fi

function savedefault {
  if [ -z "${boot_once}" ]; then
    saved_entry="${chosen}"
    save_env saved_entry
  fi
}
function load_video {
  if [ x$feature_all_video_module = xy ]; then
    insmod all_video
  else
    insmod efi_gop
    insmod efi_uga
    insmod ieee1275_fb
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
  fi
}

if [ x$feature_default_font_path = xy ] ; then
   font=unicode
else
insmod part_msdos
insmod ext2
search --no-floppy --fs-uuid --set=root 41bea907-da2e-4747-b848-8a2af4ce43bf
    font="/usr/share/grub/unicode.pf2"
fi

if loadfont $font ; then
  set gfxmode=auto
  load_video
  insmod gfxterm
fi
terminal_output console
if [ "${recordfail}" = 1 ] ; then
  set timeout=0
else
  if [ x$feature_timeout_style = xy ] ; then
    set timeout_style=menu
    set timeout=0
  # Fallback normal timeout code in case the timeout_style feature is
  # unavailable.
  else
    set timeout=0
  fi
fi
set timeout=5
set menu_color_normal=cyan/blue
set menu_color_highlight=white/blue

menuentry 'Debian GNU/Hurd virtio' --class debian --class gnu --class os $menuentry_id_option 'gnuhurd-simple-41bea907-da2e-4747-b848-8a2af4ce43bf' {
	insmod part_msdos
	insmod ext2
	search --no-floppy --fs-uuid --set=root 41bea907-da2e-4747-b848-8a2af4ce43bf
	echo		'Loading GNU Mach ...'
	multiboot	/boot/gnumach-1.8-hurdkit.gz root=part:2:device:wd0 console=com0
	insmod part_msdos
	insmod ext2
	search --no-floppy --fs-uuid --set=root 41bea907-da2e-4747-b848-8a2af4ce43bf
	echo		'Loading the Hurd ...'
	module          /hurd/pci-arbiter.static pci-arbiter \
			--host-priv-port='${host-port}' --device-master-port='${device-port}' \
			--next-task='${acpi-task}' \
			'$(pci-task=task-create)' '$(task-resume)'
	module          /hurd/acpi.static acpi \
			 \
			--next-task='${disk-task}' \
			'$(acpi-task=task-create)' 
	module          /hurd/virtio-blk.static virtio-blk \
			 \
			--next-task='${fs-task}' \
			'$(disk-task=task-create)'
	module		/hurd/ext2fs.static ext2fs --readonly \
			--multiboot-command-line='${kernel-command-line}' \
			 \
			--exec-server-task='${exec-task}' -T typed '${root}' \
			'$(fs-task=task-create)' 
	module		/lib/ld-x86-64.so.1 exec /hurd/exec '$(exec-task=task-create)'
}

